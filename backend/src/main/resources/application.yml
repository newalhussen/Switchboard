spring:
  application:
    name: switchboard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/switchboard}
    username: ${DB_USER:switchboard}
    password: ${DB_PASSWORD:switchboard}
  config:
    import: optional:file:.env[.properties]

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

switchboard:
  # Bearer token for the management API. Required, 16+ characters.
  admin-token: ${SWITCHBOARD_ADMIN_TOKEN:}
  environments: development,staging,production
